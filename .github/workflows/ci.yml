name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: git config --global user.email ci@localhost && git config --global user.name CI
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install the workspace's minimum Rust version
        run: |
          msrv=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["rust-version"])')
          rustup toolchain install "$msrv" --profile minimal
          rustup override set "$msrv"
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets --locked

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest, target: aarch64-apple-darwin }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-gnu, flags: --use-napi-cross }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl, flags: -x }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-musl, flags: -x }
          - { host: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: contains(matrix.target, 'musl')
      - run: pnpm install --frozen-lockfile
      - run: pnpm napi build --platform --release --manifest-path crates/affected-node/Cargo.toml --output-dir . --js native.cjs --dts native.d.cts --target ${{ matrix.target }} ${{ matrix.flags }}
      - uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: '*.node'
          if-no-files-found: error
          retention-days: 7

  binary:
    name: binary (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: ubuntu-latest, target: x86_64-unknown-linux-musl, zig: true, smoke: true }
          - { host: ubuntu-latest, target: aarch64-unknown-linux-musl, zig: true }
          - { host: macos-latest, target: aarch64-apple-darwin, smoke: true }
          - { host: macos-latest, target: x86_64-apple-darwin }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, smoke: true }
    runs-on: ${{ matrix.host }}
    defaults:
      run:
        shell: bash
    env:
      # Static binaries: musl links statically by default; this also drops the MSVC runtime DLLs.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: binary-${{ matrix.target }}
      - uses: mlugg/setup-zig@v2
        if: matrix.zig
      - uses: taiki-e/install-action@v2
        if: matrix.zig
        with:
          tool: cargo-zigbuild
      - run: cargo ${{ matrix.zig && 'zigbuild' || 'build' }} --release --locked -p affected-ts --target ${{ matrix.target }}
      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          name="affected-$TARGET"
          exe=""
          case "$TARGET" in *windows*) exe=.exe ;; esac
          mkdir -p "package/$name" dist-bin
          cp "target/$TARGET/release/affected$exe" LICENSE README.md "package/$name/"
          cd "package/$name"
          if [ -n "$exe" ]; then 7z a -tzip "../../dist-bin/$name.zip" . >/dev/null; else tar -czf "../../dist-bin/$name.tar.gz" ./*; fi
          cd ../../dist-bin
          for file in ./*; do
            file="${file#./}"
            if command -v sha256sum >/dev/null; then sha256sum "$file"; else shasum -a 256 "$file"; fi > "$file.sha256"
          done
          ls -l
      - name: Smoke test
        if: matrix.smoke
        run: |
          bin="target/${{ matrix.target }}/release/affected"
          "$bin" --version
          "$bin" -e cli=src/cli.ts -c src/index.ts --exit-code
      - name: Static on Linux
        if: matrix.zig
        run: file "target/${{ matrix.target }}/release/affected" | tee /dev/stderr | grep -q 'statically linked'
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: dist-bin/*
          if-no-files-found: error
          retention-days: 7

  test:
    name: test (${{ matrix.target }}, node ${{ matrix.node }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { host: macos-latest, target: aarch64-apple-darwin, node: 24 }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, node: 20 }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, node: 22 }
          - { host: ubuntu-latest, target: x86_64-unknown-linux-gnu, node: 24 }
          - { host: windows-latest, target: x86_64-pc-windows-msvc, node: 24 }
    runs-on: ${{ matrix.host }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ts
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v8
        with:
          name: bindings-${{ matrix.target }}
      - run: git config --global user.email ci@localhost && git config --global user.name CI
      - run: pnpm typecheck
      - run: node --test test/*.test.ts
        if: matrix.node != 20
      # Node 20 cannot strip types: smoke-test the compiled package and CLI instead.
      - run: node test/smoke.mjs
        if: matrix.node == 20

  test-musl:
    name: test (x86_64-unknown-linux-musl, alpine)
    needs: build
    runs-on: ubuntu-latest
    container: node:24-alpine
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v7
      - run: corepack enable && pnpm install --frozen-lockfile && pnpm build:ts
      - uses: actions/download-artifact@v8
        with:
          name: bindings-x86_64-unknown-linux-musl
      - run: git config --global --add safe.directory '*' && git config --global user.email ci@localhost && git config --global user.name CI
      - run: node test/smoke.mjs
