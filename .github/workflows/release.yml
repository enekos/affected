name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Tag matches package.json and Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm_version=$(node -p "require('./package.json').version")
          cargo_version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          echo "tag=$tag npm=$npm_version cargo=$cargo_version"
          test "$tag" = "$npm_version" && test "$tag" = "$cargo_version"
      - name: CHANGELOG has a section for the release
        run: grep -q "^## \[${GITHUB_REF_NAME#v}\]" CHANGELOG.md

  ci:
    needs: version
    uses: ./.github/workflows/ci.yml

  github:
    needs: ci
    runs-on: ubuntu-latest
    environment:
      name: github-releases
      url: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: bindings
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: binaries
          merge-multiple: true
      - name: Release notes from CHANGELOG
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          printf '\n**npm:** https://www.npmjs.com/package/@enekos/affected/v/%s\n' "$version" >> notes.md
          cat >> notes.md <<'NOTES'

          **Without Node:** `affected-<target>.tar.gz` (`.zip` on Windows), each with a `.sha256`, or `cargo binstall --git https://github.com/enekos/affected affected-ts`.
          NOTES
      - run: gh release create "$GITHUB_REF_NAME" bindings/*.node binaries/* --title "$GITHUB_REF_NAME" --notes-file notes.md $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Move the major tag the GitHub Action is used by (enekos/affected@v0)
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major" "$GITHUB_SHA"
          git push -f origin "refs/tags/$major"
