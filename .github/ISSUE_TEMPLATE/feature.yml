name: Feature request
description: A new edge kind, option or integration
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What do you need to know about a diff that affected cannot tell you today?
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
  - type: textarea
    id: prior-art
    attributes:
      label: Prior art
      description: Does another tool (Nx, Turborepo, jest, vitest, Bazel…) do this? How?
