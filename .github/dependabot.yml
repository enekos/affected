version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: weekly }
    groups:
      oxc: { patterns: ['oxc*'] }
      rust: { patterns: ['*'], exclude-patterns: ['oxc*'] }
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ['*'] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups:
      actions: { patterns: ['*'] }
