[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/enekos/affected"
homepage = "https://enekos.github.io/affected/"
authors = ["Eneko Sarasola"]

[workspace.dependencies]
affected-core = { path = "crates/affected-core" }
oxc_allocator = "0.160.0"
oxc_ast = "0.160.0"
oxc_ast_visit = "0.160.0"
oxc_parser = "0.160.0"
oxc_span = "0.160.0"
oxc_resolver = { version = "11.24.3", default-features = false }
rayon = "1.12.0"
rustc-hash = "2.1.3"
globset = { version = "0.4.22", default-features = false }
thiserror = "2.0.21"
dunce = "1.0.5"
serde_json = "1.0.154"
serde = { version = "1.0.229", features = ["derive"] }
lexopt = "0.3.2"
json-strip-comments = "3.1.3"
tempfile = "3.27.0"
napi = { version = "3.16.3", default-features = false, features = ["napi6"] }
napi-derive = "3.7.2"
napi-build = "2.7.0"

[workspace.lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
await_holding_lock = "deny"
rc_mutex = "deny"
mutex_atomic = "warn"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
multiple_unsafe_ops_per_block = "deny"
mem_forget = "deny"
clone_on_ref_ptr = "warn"
large_enum_variant = "warn"
unwrap_used = "warn"
let_underscore_must_use = "warn"
dbg_macro = "deny"
todo = "deny"
allow_attributes_without_reason = "warn"
indexing_slicing = "warn"
string_slice = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
